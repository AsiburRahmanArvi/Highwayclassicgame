name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3" buildozer virtualenv

      - name: Build for 64-bit phones only (faster)
        run: sed -i 's/^android.archs.*/android.archs = arm64-v8a/' buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HighwayClassic-apk
          path: bin/*.apk
          if-no-files-found: warn
          
